---
# Fedora Workstation Inventory
# Supports both local and remote execution

all:
  hosts:
    localhost:
      ansible_connection: local
      ansible_user: "{{ ansible_user_id }}"
      ansible_become: true
      ansible_become_method: sudo
  
  children:
    local_workstation:
      hosts:
        localhost:
      vars:
        # Target user (actual user, not root)
        target_user: "{{ ansible_env.SUDO_USER | default(ansible_user_id) }}"
        # System variables
        system_family: "{{ ansible_facts.os_family }}"
        system_distro: "{{ ansible_facts.distribution }}"
