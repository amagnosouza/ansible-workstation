name: Ansible validation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Ansible project
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install validation tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install ansible-core ansible-lint yamllint

      - name: Validate YAML
        run: yamllint -d relaxed .

      - name: Validate Ansible syntax
        run: ansible-playbook site.yml -i localhost, --syntax-check

      - name: Run Ansible lint
        run: ansible-lint site.yml

      - name: Validate role references
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          site = yaml.safe_load(Path("site.yml").read_text())
          roles = [entry["name"] for entry in site[0]["roles"]]
          missing = [
              role for role in roles if not (Path("roles") / role).is_dir()
          ]
          if missing:
              message = f"Missing role directories: {', '.join(missing)}"
              raise SystemExit(message)
          print(f"Validated {len(roles)} role directories")
          PY
