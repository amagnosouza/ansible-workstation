---
# Site playbook - Fedora Workstation Professional Setup
# Execute with: ansible-playbook site.yml --ask-become-pass
# Or locally: ansible-playbook site.yml -i localhost, --ask-become-pass

- name: Fedora Workstation Professional Setup
  hosts: localhost
  connection: local
  gather_facts: true

  pre_tasks:
    - name: Ensure running on Fedora
      ansible.builtin.assert:
        that:
          - ansible_facts['os_family'] == 'RedHat'
          - ansible_facts['distribution'] == 'Fedora'
        fail_msg: "This playbook is designed for Fedora Workstation."
        success_msg: >-
          Detected Fedora {{ ansible_facts['distribution_version'] }}:
          proceeding with configuration.
      tags: [always]

    - name: Create logs directory
      ansible.builtin.file:
        path: "{{ playbook_dir }}/logs"
        state: directory
        mode: '0755'
      become: false
      tags: [always]

  roles:
    - role: base_system
      tags: [base, always]

    - role: shell_zsh
      tags: [shell, zsh]

    - role: fonts_nerd
      tags: [fonts, nerd]

    - role: starship_prompt
      tags: [starship, prompt]

    - role: development_tools
      tags: [development, tools]

    - role: containers_docker
      tags: [docker, containers]

    - role: kubernetes
      tags: [kubernetes, k8s]

    - role: browsers
      tags: [browsers, web]

  post_tasks:
    - name: Display setup completion summary
      ansible.builtin.debug:
        msg: |
          ===================================================
          ✓ Fedora Workstation Professional Setup Complete!
          ===================================================

          Installed Components:
          ✓ Base Development Tools (vim, git, make, curl, etc.)
          ✓ Shell: Zsh with Oh My Zsh
          ✓ Prompt: Starship with Catppuccin Latte
          ✓ Terminal Font: Hack Nerd Font
          ✓ IDE: Visual Studio Code
          ✓ Container Runtime: Docker Engine & Docker Compose
          ✓ Orchestration: kubectl & Kubernetes
          ✓ IaC: Terraform
          ✓ Cloud: AWS CLI
          ✓ Browsers: Microsoft Edge, Google Chrome, Brave Browser
          ✓ Utilities: btop, ncdu, tree, tmux, Ghostty, etc.

          Next Steps:
          1. Open a new terminal (Zsh with Starship active)
          2. Set terminal font to "Hack Nerd Font"
          3. Verify installations:
             - zsh --version
             - starship --version
             - docker --version
             - docker compose version
             - kubectl version --client
             - terraform version
             - code --version
          4. Configure VS Code extensions
          5. Test Docker: docker run --rm hello-world
          6. Configure kubectl context

          Useful Commands:
          - ansible-playbook site.yml --tags shell,starship
          - ansible-playbook site.yml --tags docker
          - ansible-playbook site.yml --tags kubernetes
          - ansible-playbook site.yml --tags browsers

          Documentation:
          - Starship: https://starship.rs
          - Docker: https://docs.docker.com
          - Kubernetes: https://kubernetes.io
          - Fedora: https://docs.fedoraproject.org

          ===================================================
      tags: [always]
