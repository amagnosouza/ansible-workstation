---
# Tasks for Zsh shell configuration

- name: Check if Oh My Zsh is present
  ansible.builtin.stat:
    path: "/home/{{ target_user }}/.oh-my-zsh"
  register: shell_zsh_ohmyzsh
  tags: [zsh]

- name: Download Oh My Zsh installer
  ansible.builtin.get_url:
    url: https://raw.githubusercontent.com/ohmyzsh/ohmyzsh/master/tools/install.sh
    dest: /tmp/ohmyzsh-install.sh
    mode: '0755'
  when: not shell_zsh_ohmyzsh.stat.exists
  become: true
  become_user: "{{ target_user }}"
  tags: [zsh]

- name: Install Oh My Zsh non-interactively
  ansible.builtin.command:
    cmd: env RUNZSH=no CHSH=no KEEP_ZSHRC=yes sh /tmp/ohmyzsh-install.sh
  when: not shell_zsh_ohmyzsh.stat.exists
  become: true
  changed_when: true
  become_user: "{{ target_user }}"
  tags: [zsh]

- name: Set default shell to Zsh
  ansible.builtin.user:
    name: "{{ target_user }}"
    shell: /usr/bin/zsh
  tags: [zsh]

- name: Ensure Zsh is registered in /etc/shells
  ansible.builtin.lineinfile:
    path: /etc/shells
    line: /usr/bin/zsh
    state: present
  register: shell_zsh_shells_updated
  tags: [zsh]

- name: Create Zsh config directory
  ansible.builtin.file:
    path: "/home/{{ target_user }}/.oh-my-zsh/completions"
    state: directory
    mode: '0755'
    owner: "{{ target_user }}"
    group: "{{ target_user }}"
  tags: [zsh]

- name: Deploy Zsh configuration from template
  ansible.builtin.template:
    src: zshrc.j2
    dest: "/home/{{ target_user }}/.zshrc"
    owner: "{{ target_user }}"
    group: "{{ target_user }}"
    mode: '0644'
  become: true
  become_user: "{{ target_user }}"
  tags: [zsh]
