---
# Tasks for Nerd Font installation

- name: Create fonts directory
  ansible.builtin.file:
    path: "/home/{{ target_user }}/.local/share/fonts"
    state: directory
    mode: '0755'
    owner: "{{ target_user }}"
    group: "{{ target_user }}"
  tags: [fonts]

- name: Download Nerd Font
  ansible.builtin.get_url:
    url: "{{ fonts_nerd_release_base }}/v{{ fonts_nerd_version }}/{{ fonts_nerd_name }}.zip"
    dest: "/tmp/{{ fonts_nerd_name }}.zip"
    mode: '0644'
  register: fonts_nerd_download
  tags: [fonts]

- name: Extract Nerd Font  # noqa no-handler
  ansible.builtin.unarchive:
    src: "/tmp/{{ fonts_nerd_name }}.zip"
    dest: "/home/{{ target_user }}/.local/share/fonts"
    remote_src: true
  when: fonts_nerd_download.changed
  tags: [fonts]

- name: Update font cache
  ansible.builtin.command:
    cmd: "fc-cache -fv /home/{{ target_user }}/.local/share/fonts"
  changed_when: false
  tags: [fonts]

- name: Clean up downloaded archive
  ansible.builtin.file:
    path: "/tmp/{{ fonts_nerd_name }}.zip"
    state: absent
  tags: [fonts]
