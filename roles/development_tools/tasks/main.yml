---
# Tasks for development tools (VS Code, Terraform, AWS CLI)

- name: Install AWS CLI
  ansible.builtin.dnf:
    name: awscli
    state: present
  tags: [aws, development]

- name: Configure HashiCorp repository
  ansible.builtin.yum_repository:
    name: hashicorp
    description: HashiCorp Stable - $basearch
    baseurl: https://rpm.releases.hashicorp.com/fedora/$releasever/$basearch/stable
    gpgcheck: true
    gpgkey: https://rpm.releases.hashicorp.com/gpg
    enabled: true
  tags: [terraform, development]

- name: Install Terraform
  ansible.builtin.dnf:
    name: terraform
    state: present
  tags: [terraform, development]

- name: Configure VS Code repository
  ansible.builtin.yum_repository:
    name: vscode
    description: Visual Studio Code Repository
    baseurl: https://packages.microsoft.com/yumrepos/vscode
    gpgcheck: true
    gpgkey: https://packages.microsoft.com/keys/microsoft.asc
    enabled: true
  tags: [vscode, development]

- name: Install Visual Studio Code
  ansible.builtin.dnf:
    name: code
    state: present
  tags: [vscode, development]
